[project]
name = "lightwave-server"
version = "1.0.0"
description = "HTTP API for controlling ws281x (NeoPixel) LED strips"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
pi = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-neopixel>=6.4.2",
    "rpi-gpio>=0.7.1 ; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
    "rpi-ws281x>=5.0.0 ; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
# Reduce noise while keeping critical error detection
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUntypedFunctionDecorator = false
reportGeneralTypeIssues = "error"
reportOptionalMemberAccess = false

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# E (Error), F (Pyflakes), I (Isort), N (Naming)
select = ["E", "F", "I", "N"]
